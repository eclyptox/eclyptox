<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200" role="img" aria-label="eclyptox — Backend &amp; AI Automation Engineer">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .name { font: bold 38px 'Segoe UI', system-ui, sans-serif; fill: #e6edf3; letter-spacing: -0.5px; }
      .title { font: 500 16px 'Segoe UI', system-ui, sans-serif; fill: #7d8590; letter-spacing: 0.5px; }
      .tag { font: 400 13px 'Segoe UI Mono', 'Fira Code', monospace; fill: #3fb950; }
      .dot { fill: #238636; }
      .line { stroke: #21262d; stroke-width: 1; }
      .node { fill: none; stroke: #30363d; stroke-width: 1.5; }
      .node-active { fill: none; stroke: #1f6feb; stroke-width: 1.5; }
      .edge { stroke: #21262d; stroke-width: 1; fill: none; }
      .edge-active { stroke: #1f6feb; stroke-width: 1; fill: none; opacity: 0.6; }
      .pulse { fill: #1f6feb; opacity: 0.15; }
      @media (prefers-color-scheme: light) {
        .bg { fill: #f6f8fa; }
        .name { fill: #1f2328; }
        .title { fill: #656d76; }
        .tag { fill: #1a7f37; }
        .dot { fill: #1a7f37; }
        .line { stroke: #d1d9e0; }
        .node { stroke: #d1d9e0; }
        .node-active { stroke: #0969da; }
        .edge { stroke: #d1d9e0; }
        .edge-active { stroke: #0969da; }
        .pulse { fill: #0969da; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="900" height="200" rx="12"/>

  <!-- Subtle grid lines -->
  <line class="line" x1="0" y1="40" x2="900" y2="40"/>
  <line class="line" x1="0" y1="160" x2="900" y2="160"/>

  <!-- Flow graph — right side decoration -->
  <!-- Nodes -->
  <circle class="node" cx="680" cy="70" r="16"/>
  <circle class="node-active" cx="730" cy="110" r="16"/>
  <circle class="node" cx="780" cy="70" r="16"/>
  <circle class="node" cx="830" cy="130" r="16"/>
  <circle class="node-active" cx="860" cy="80" r="14"/>

  <!-- Edges -->
  <path class="edge" d="M696 70 Q713 70 714 110"/>
  <path class="edge-active" d="M714 110 Q714 90 764 70"/>
  <path class="edge" d="M796 70 Q820 70 830 114"/>
  <path class="edge-active" d="M730 94 Q760 80 764 70"/>
  <path class="edge" d="M844 130 Q855 115 846 94"/>

  <!-- Small pulse circles on active nodes -->
  <circle class="pulse" cx="730" cy="110" r="22"/>
  <circle class="pulse" cx="860" cy="80" r="20"/>

  <!-- Node icons (dots) -->
  <circle class="dot" cx="680" cy="70" r="4"/>
  <circle class="dot" cx="730" cy="110" r="5"/>
  <circle class="dot" cx="780" cy="70" r="4"/>
  <circle class="dot" cx="830" cy="130" r="4"/>
  <circle class="dot" cx="860" cy="80" r="4"/>

  <!-- Left content -->
  <!-- Name -->
  <text class="name" x="44" y="88">eclyptox</text>

  <!-- Separator dot -->
  <circle fill="#3fb950" cx="220" cy="78" r="3"/>

  <!-- Title -->
  <text class="title" x="44" y="115">Backend &amp; AI Automation Engineer</text>

  <!-- Tags -->
  <text class="tag" x="44" y="148">PHP · Symfony · Elasticsearch · DDD · Home Assistant · AI workflows</text>

  <!-- Location -->
  <text style="font: 400 12px 'Segoe UI', sans-serif; fill: #484f58;" x="44" y="172">Spain</text>
</svg>
